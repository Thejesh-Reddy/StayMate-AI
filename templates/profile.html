<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Profile - StayMate AI</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >

  <style>
    .profile-page {
      min-height: 100vh;
      padding: 50px 24px;
      background: #f5fafc;
    }

    .profile-page-container {
      width: min(620px, 100%);
      margin: 0 auto;
    }

    .profile-page-header {
      margin-bottom: 28px;
    }

    .profile-page-header h1 {
      margin: 0;
      color: #18384b;
      font-size: 30px;
      font-weight: 800;
    }

    .profile-page-header p {
      margin: 8px 0 0;
      color: #718895;
      font-size: 14px;
    }

    .profile-card {
      overflow: hidden;
      border: 1px solid #e0edf2;
      border-radius: 22px;
      background: #ffffff;
      box-shadow: 0 18px 45px rgba(31, 73, 95, 0.10);
    }

    .profile-card-top {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 28px;
      background: linear-gradient(
        135deg,
        #eef9fd,
        #ffffff
      );
      border-bottom: 1px solid #edf2f5;
    }

    .profile-page-initial {
      width: 68px;
      height: 68px;
      flex: 0 0 68px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        #159bd3,
        #1689bd
      );
      color: #ffffff;
      font-size: 26px;
      font-weight: 800;
      text-transform: uppercase;
      box-shadow: 0 10px 22px rgba(21, 155, 211, 0.22);
    }

    .profile-page-user {
      min-width: 0;
    }

    .profile-page-user h2 {
      margin: 0;
      color: #18384b;
      font-size: 20px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .profile-page-user p {
      margin: 5px 0 0;
      color: #718895;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .profile-actions {
      padding: 10px 18px 18px;
    }

    .profile-action-button {
      width: 100%;
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-top: 8px;
      padding: 0 16px;
      border: 1px solid #e2edf2;
      border-radius: 14px;
      background: #ffffff;
      color: #29495a;
      font-size: 14px;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .profile-action-button:hover {
      transform: translateY(-1px);
      background: #f7fcfe;
      border-color: #b9dce9;
      box-shadow: 0 8px 20px rgba(31, 73, 95, 0.08);
    }

    .profile-action-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .profile-action-icon {
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 36px;
      border-radius: 10px;
      background: #eef8fc;
      color: #159bd3;
      font-size: 17px;
      font-weight: 800;
    }

    .profile-action-arrow {
      color: #8aa0aa;
      font-size: 18px;
    }

    .profile-action-button.logout {
      border-color: #f0d8d8;
      background: #fff7f7;
      color: #c44747;
    }

    .profile-action-button.logout:hover {
      background: #fff0f0;
      border-color: #e7bcbc;
      box-shadow: none;
    }

    .profile-action-button.logout .profile-action-icon {
      background: #fdecec;
      color: #c44747;
    }

    .profile-divider {
      height: 1px;
      margin: 12px 0;
      background: #edf2f5;
    }

    .profile-page-footer {
      margin-top: 22px;
      text-align: center;
    }

    .back-home-button {
      border: none;
      background: transparent;
      color: #159bd3;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .back-home-button:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .profile-page {
        padding: 30px 15px;
      }

      .profile-card-top {
        padding: 22px;
      }

      .profile-page-initial {
        width: 58px;
        height: 58px;
        flex-basis: 58px;
        border-radius: 17px;
      }
    }
  </style>
</head>

<body>

  <main class="profile-page">

    <div class="profile-page-container">

      <div class="profile-page-header">
        <h1>My Profile</h1>

        <p>
          Manage your StayMate AI account
        </p>
      </div>


      <section class="profile-card">

        <div class="profile-card-top">

          <div
            id="profilePageInitial"
            class="profile-page-initial"
          >
            U
          </div>

          <div class="profile-page-user">

            <h2 id="profilePageName">
              User
            </h2>

            <p id="profilePageEmail">
              Loading...
            </p>

          </div>

        </div>


        <div class="profile-actions">

          <button
            id="myBookingsPageButton"
            type="button"
            class="profile-action-button"
          >
            <span class="profile-action-left">

              <span class="profile-action-icon">
                ☰
              </span>

              <span>
                My Bookings
              </span>

            </span>

            <span class="profile-action-arrow">
              →
            </span>
          </button>


          <div class="profile-divider"></div>


          <button
            id="profileLogoutButton"
            type="button"
            class="profile-action-button logout"
          >
            <span class="profile-action-left">

              <span class="profile-action-icon">
                ↪
              </span>

              <span>
                Logout
              </span>

            </span>

            <span class="profile-action-arrow">
              →
            </span>
          </button>

        </div>

      </section>


      <div class="profile-page-footer">
        <a href="{{ url_for('index') }}" class="back-home-button">
            ← Back to StayMate AI
        </a>
    </div>

    </div>

  </main>


  <script>
    function getInitial(name) {

      const cleanName =
        String(name || "").trim();

      if (!cleanName) {
        return "U";
      }

      return cleanName
        .charAt(0)
        .toUpperCase();
    }


    async function loadProfile() {

      try {

        const response =
          await fetch(
            "/api/auth/session",
            {
              method: "GET",
              credentials: "same-origin",
              headers: {
                Accept: "application/json"
              }
            }
          );


        const data =
          await response.json();


        if (
          !response.ok ||
          !data.authenticated
        ) {
          window.location.href =
            "/signin";

          return;
        }


        const name =
          data.user_name || "User";

        const email =
          data.user_email || "";


        const initial =
          getInitial(name);


        document
          .getElementById(
            "profilePageInitial"
          )
          .textContent = initial;


        document
          .getElementById(
            "profilePageName"
          )
          .textContent = name;


        document
          .getElementById(
            "profilePageEmail"
          )
          .textContent = email;

      } catch (error) {

        console.error(
          "Unable to load profile:",
          error
        );

      }
    }


    document
      .getElementById(
        "myBookingsPageButton"
      )
      .addEventListener(
        "click",
        () => {
          window.location.href = "/my-bookings";
        }
      );


    document
      .getElementById(
        "profileLogoutButton"
      )
      .addEventListener(
        "click",
        async () => {

          const button =
            document.getElementById(
              "profileLogoutButton"
            );

          button.disabled = true;

          button.querySelector(
            ".profile-action-left span:last-child"
          ).textContent =
            "Logging out...";


          try {

            const response =
              await fetch(
                "/api/auth/logout",
                {
                  method: "POST",
                  credentials: "same-origin",
                  headers: {
                    Accept:
                      "application/json"
                  }
                }
              );


            if (response.ok) {

              window.location.href =
                "/signin";

              return;
            }


            throw new Error(
              "Logout failed"
            );

          } catch (error) {

            console.error(
              "Logout error:",
              error
            );

            button.disabled = false;

            button.querySelector(
              ".profile-action-left span:last-child"
            ).textContent =
              "Logout";

            alert(
              "Unable to logout. Please try again."
            );
          }
        }
      );


    loadProfile();
  </script>

</body>
</html>
