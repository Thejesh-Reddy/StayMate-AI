<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Compare Hotel Prices | StayMate AI</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #f5fbff,
          #eef8fc
        );

      color: #17324d;
    }

    .page {
      width: min(
        1100px,
        calc(100% - 32px)
      );

      margin: 0 auto;

      padding:
        30px 0 50px;
    }

    .topbar {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

      margin-bottom: 25px;
    }

    .brand {
      font-size: 24px;

      font-weight: 850;

      color: #087fbd;
    }

    .back-button {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-height: 40px;

      padding:
        0 15px;

      border: 0;

      border-radius: 10px;

      background: #ffffff;

      color: #087fbd;

      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 5px 18px
        rgba(
          8,
          127,
          189,
          0.10
        );
    }

    .hotel-summary {
      display: grid;

      grid-template-columns:
        1fr;

      gap: 8px;

      padding: 25px;

      border-radius: 18px;

      background: #ffffff;

      box-shadow:
        0 12px 35px
        rgba(
          25,
          80,
          110,
          0.10
        );

      margin-bottom: 25px;
    }

    .hotel-name {
      margin: 0;

      font-size: 27px;

      font-weight: 850;
    }

    .hotel-address {
      color: #60788c;

      font-size: 14px;
    }

    .search-details {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 8px;
    }

    .info-pill {
      padding:
        7px 11px;

      border-radius: 999px;

      background: #eff9fc;

      color: #087fbd;

      font-size: 12px;

      font-weight: 700;
    }

    .section-title {
      margin:
        0 0 15px;

      font-size: 22px;

      font-weight: 850;
    }

    .comparison-list {
      display: grid;

      gap: 15px;
    }

    .price-card {
      display: grid;

      grid-template-columns:
        minmax(180px, 1fr)
        auto
        auto;

      align-items: center;

      gap: 20px;

      padding: 20px;

      border-radius: 16px;

      background: #ffffff;

      border:
        1px solid #e3eef3;

      box-shadow:
        0 8px 25px
        rgba(
          25,
          80,
          110,
          0.07
        );
    }

    .provider {
      display: flex;

      align-items: center;

      gap: 12px;
    }

    .provider-logo {
      width: 42px;

      height: 42px;

      object-fit: contain;

      border-radius: 8px;

      background: #f5f8fa;

      padding: 5px;
    }

    .provider-name {
      font-weight: 800;

      font-size: 15px;
    }

    .provider-note {
      margin-top: 4px;

      color: #718697;

      font-size: 11px;
    }

    .price-block {
      text-align: right;
    }

    .price {
      font-size: 21px;

      font-weight: 850;

      color: #087fbd;
    }

    .price-label {
      display: block;

      margin-top: 3px;

      color: #7a8d9b;

      font-size: 11px;
    }

    .deal-button,
    .staymate-button {
      min-height: 42px;

      padding:
        0 17px;

      border: 0;

      border-radius: 10px;

      color: #ffffff;

      background:
        linear-gradient(
          135deg,
          #087fbd,
          #20b8d4
        );

      font-weight: 800;

      cursor: pointer;

      text-decoration: none;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      white-space: nowrap;
    }

    .staymate-card {
      border:
        2px solid #087fbd;
    }

    .staymate-badge {
      display: inline-block;

      margin-bottom: 5px;

      padding:
        4px 8px;

      border-radius: 999px;

      background: #eaf8fc;

      color: #087fbd;

      font-size: 10px;

      font-weight: 850;
    }

    .empty-state {
      padding: 40px 25px;

      text-align: center;

      border-radius: 16px;

      background: #ffffff;

      color: #667c8d;

      box-shadow:
        0 8px 25px
        rgba(
          25,
          80,
          110,
          0.07
        );
    }

    .loading {
      padding: 40px;

      text-align: center;

      color: #087fbd;

      font-weight: 750;
    }

    @media (
      max-width: 700px
    ) {

      .page {
        width:
          min(
            100% - 20px,
            1100px
          );

        padding-top: 18px;
      }

      .topbar {
        align-items:
          flex-start;

        flex-direction:
          column;
      }

      .price-card {
        grid-template-columns:
          1fr;

        gap: 13px;
      }

      .price-block {
        text-align: left;
      }

      .deal-button,
      .staymate-button {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <div class="topbar">

      <div class="brand">
        StayMate AI
      </div>

      <button
        class="back-button"
        type="button"
        onclick="window.location.href='/'"
      >
        ← Back to Hotels
      </button>

    </div>


    <section
      id="hotelSummary"
      class="hotel-summary"
    >

      <h1
        id="hotelName"
        class="hotel-name"
      >
        Loading hotel...
      </h1>

      <div
        id="hotelAddress"
        class="hotel-address"
      ></div>

      <div
        id="searchDetails"
        class="search-details"
      ></div>

    </section>


    <h2 class="section-title">
      Compare Prices
    </h2>


    <section
      id="comparisonList"
      class="comparison-list"
    >

      <div class="loading">
        Loading available prices...
      </div>

    </section>

  </main>


  <script>

  // ==========================================================
  // URL PARAMETERS
  // ==========================================================

  const params =
    new URLSearchParams(
      window.location.search
    );


  const hotelName =
    params.get("name") ||
    "Hotel";


  const address =
    params.get("address") ||
    "";


  const fallbackPrice =
    params.get("price") ||
    "";


  const searchLocation =
    params.get("location") ||
    "";


  const checkIn =
    params.get("check_in") ||
    "";


  const checkOut =
    params.get("check_out") ||
    "";


  const adults =
    params.get("adults") ||
    "2";


  const children =
    params.get("children") ||
    "0";


  const rooms =
    params.get("rooms") ||
    "1";


  const propertyToken =
    params.get("property_token") ||
    "";


  // ==========================================================
  // DOM
  // ==========================================================

  const hotelNameElement =
    document.getElementById(
      "hotelName"
    );


  const hotelAddressElement =
    document.getElementById(
      "hotelAddress"
    );


  const detailsElement =
    document.getElementById(
      "searchDetails"
    );


  const list =
    document.getElementById(
      "comparisonList"
    );


  // ==========================================================
  // HELPERS
  // ==========================================================

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );
  }


  function money(
    value
  ) {

    const number =
      Number(
        value
      );


    if (
      !Number.isFinite(
        number
      )
    ) {

      return "Price unavailable";
    }


    return new Intl.NumberFormat(
      "en-IN",
      {
        style:
          "currency",

        currency:
          "INR",

        maximumFractionDigits:
          0
      }
    ).format(
      number
    );
  }


  function safeUrl(
    value
  ) {

    const url =
      String(
        value || ""
      ).trim();


    if (
      /^https?:\/\//i.test(
        url
      )
    ) {

      return url;
    }


    return "";
  }


  function calculateNights() {

    if (
      !checkIn ||
      !checkOut
    ) {

      return 1;
    }


    const start =
      new Date(
        `${checkIn}T00:00:00`
      );


    const end =
      new Date(
        `${checkOut}T00:00:00`
      );


    const difference =
      end.getTime() -
      start.getTime();


    const nights =
      Math.round(
        difference /
        (
          1000 *
          60 *
          60 *
          24
        )
      );


    return Math.max(
      1,
      nights
    );
  }


  // ==========================================================
  // HOTEL SUMMARY
  // ==========================================================

  hotelNameElement.textContent =
    hotelName;


  hotelAddressElement.textContent =
    address;


  const pills = [];


  if (
    checkIn &&
    checkOut
  ) {

    pills.push(
      `📅 ${checkIn} → ${checkOut}`
    );
  }


  pills.push(
    `👤 ${adults} adults`
  );


  if (
    Number(children) > 0
  ) {

    pills.push(
      `👶 ${children} children`
    );
  }


  pills.push(
    `🛏️ ${rooms} room${
      Number(rooms) === 1
        ? ""
        : "s"
    }`
  );


  detailsElement.innerHTML =
    pills
      .map(
        value =>
          `<span class="info-pill">${
            escapeHtml(
              value
            )
          }</span>`
      )
      .join("");


  // ==========================================================
  // LOADING
  // ==========================================================

  list.innerHTML = `
    <div class="loading">
      Fetching live prices from hotel providers...
    </div>
  `;


  // ==========================================================
  // LOAD HOTEL PRICES
  // ==========================================================

  async function loadPrices() {

    if (
      !propertyToken
    ) {

      showError(
        "This hotel does not have a valid property identifier. Please go back and search again."
      );

      return;
    }


    const query =
      new URLSearchParams();


    query.set(
      "property_token",
      propertyToken
    );


    query.set(
      "location",
      searchLocation
    );


    query.set(
      "check_in",
      checkIn
    );


    query.set(
      "check_out",
      checkOut
    );


    query.set(
      "adults",
      adults
    );


    query.set(
      "children",
      children
    );


    query.set(
      "rooms",
      rooms
    );


    try {

      const response =
        await fetch(
          `/api/hotel-details?${query.toString()}`
        );


      const data =
        await response.json();


      if (
        !response.ok
      ) {

        throw new Error(
          data?.error ||
          `Server returned ${response.status}`
        );
      }


      renderComparison(
        data
      );

    } catch (
      error
    ) {

      console.error(
        "StayMate price comparison error:",
        error
      );


      showError(
        error.message ||
        "Unable to load hotel prices right now."
      );
    }
  }


  // ==========================================================
  // ERROR
  // ==========================================================

  function showError(
    message
  ) {

    list.innerHTML = `

      <div class="empty-state">

        <strong>
          Unable to load prices
        </strong>

        <br><br>

        ${escapeHtml(
          message
        )}

        <br><br>

        <button
          type="button"
          class="staymate-button"
          onclick="window.location.reload()"
        >
          Try Again
        </button>

      </div>

    `;
  }


  // ==========================================================
  // RENDER COMPARISON
  // ==========================================================

  function renderComparison(
    data
  ) {

    const property =
      data?.property ||
      {};


    const offers =
      Array.isArray(
        data?.offers
      )
        ? data.offers
        : [];


    // --------------------------------------------------------
    // Update hotel information from the live response
    // --------------------------------------------------------

    if (
      property.name
    ) {

      hotelNameElement.textContent =
        property.name;
    }


    if (
      property.address
    ) {

      hotelAddressElement.textContent =
        property.address;
    }


    // --------------------------------------------------------
    // StayMate price
    // --------------------------------------------------------

    let stayMatePrice =
      Number(
        fallbackPrice
          .replace(
            /[^\d.]/g,
            ""
          )
      );


    if (
      !Number.isFinite(
        stayMatePrice
      ) ||
      stayMatePrice <= 0
    ) {

      stayMatePrice =
        Number(
          property
            ?.rate_per_night
            ?.extracted_lowest
        );
    }


    const stayMateTotal =
      stayMatePrice > 0
        ? stayMatePrice *
          calculateNights()
        : null;


    // --------------------------------------------------------
    // Build HTML
    // --------------------------------------------------------

    let html = "";


    if (
      stayMatePrice > 0
    ) {

      html += `

        <article
          class="price-card staymate-card"
        >

          <div class="provider">

            <div>

              <span class="staymate-badge">
                STAYMATE
              </span>

              <div class="provider-name">
                StayMate AI
              </div>

              <div class="provider-note">
                Book directly through StayMate
              </div>

            </div>

          </div>


          <div class="price-block">

            <div class="price">
              ${money(
                stayMatePrice
              )}
            </div>

            <span class="price-label">
              per night
            </span>

            ${
              stayMateTotal
                ? `
                  <span
                    class="price-label"
                  >
                    Approx. ${money(
                      stayMateTotal
                    )} total
                  </span>
                `
                : ""
            }

          </div>


          <button
            type="button"
            class="staymate-button"
            id="staymateBookButton"
          >
            Book with StayMate
          </button>

        </article>

      `;
    }


    // --------------------------------------------------------
    // Provider offers
    // --------------------------------------------------------

    offers.forEach(
      offer => {

        const source =
          offer.source ||
          "Hotel provider";


        const price =
          Number(
            offer.price_per_night
          );


        const total =
          Number(
            offer.total_price
          );


        const logo =
          safeUrl(
            offer.logo
          );


        /*
         * EXTERNAL PROVIDER BOOKING LINK - TEMPORARILY DISABLED
         *
         * The provider URL is intentionally not exposed to users.
         * It is preserved in comments so it can be enabled later
         * if the required permissions/agreements are obtained.
         *
         * const bookingUrl =
         *   safeUrl(
         *     offer.link
         *   );
         */


        const cancellation =
          offer.free_cancellation
            ? `
              <div class="provider-note">
                ✓ Free cancellation
                ${
                  offer
                    .free_cancellation_until_date
                    ? `until ${escapeHtml(
                        offer
                          .free_cancellation_until_date
                      )}`
                    : ""
                }
              </div>
            `
            : "";


        const taxes =
          offer.before_taxes != null
            ? `
              <div class="provider-note">
                Before taxes & fees:
                ${money(
                  offer.before_taxes
                )}
              </div>
            `
            : "";


        const totalText =
          Number.isFinite(
            total
          ) &&
          total > 0
            ? `
              <div class="provider-note">
                Total stay:
                ${money(
                  total
                )}
              </div>
            `
            : "";


        const logoHtml =
          logo
            ? `
              <img
                class="provider-logo"
                src="${escapeHtml(
                  logo
                )}"
                alt="${escapeHtml(
                  source
                )}"
                loading="lazy"
              >
            `
            : `
              <div
                class="provider-logo"
                aria-hidden="true"
              >
                🏨
              </div>
            `;


        /*
         * EXTERNAL PROVIDER BOOKING BUTTON - TEMPORARILY DISABLED
         *
         * No external "View Deal" button is rendered.
         * Users can compare provider names and prices, while
         * "Book with StayMate" remains the only active booking option.
         *
         * Original code preserved for future use:
         *
         * const buttonHtml =
         *   bookingUrl
         *     ? `
         *       <a
         *         class="deal-button"
         *         href="${escapeHtml(
         *           bookingUrl
         *         )}"
         *         target="_blank"
         *         rel="noopener noreferrer"
         *       >
         *         View Deal
         *       </a>
         *     `
         *     : `
         *       <button
         *         type="button"
         *         class="deal-button"
         *         disabled
         *         title="Booking link not supplied by the provider"
         *         style="opacity:0.55;cursor:not-allowed;"
         *       >
         *         Deal Unavailable
         *       </button>
         *     `;
         */


        html += `

          <article
            class="price-card"
          >

            <div class="provider">

              ${logoHtml}

              <div>

                <div class="provider-name">
                  ${escapeHtml(
                    source
                  )}

                  ${
                    offer.official
                      ? `
                        <span
                          class="provider-note"
                        >
                          Official
                        </span>
                      `
                      : ""
                  }

                </div>

                ${cancellation}

                ${taxes}

                ${totalText}

              </div>

            </div>


            <div class="price-block">

              <div class="price">
                ${
                  Number.isFinite(
                    price
                  )
                    ? money(
                        price
                      )
                    : "Price unavailable"
                }
              </div>

              <span class="price-label">
                per night
              </span>

            </div>


            <!--
              EXTERNAL PROVIDER BOOKING BUTTON DISABLED.

              Users can only book through StayMate.
              The original external booking code is preserved
              above in JavaScript comments for future use.
            -->

          </article>
        `;
      }
    );


    if (
      !html
    ) {

      html = `

        <div class="empty-state">

          No provider prices were
          returned for this hotel.

        </div>

      `;
    }


    list.innerHTML =
      html;


    // ========================================================
    // STAYMATE BOOKING BUTTON
    // ========================================================

    const stayMateButton =
      document.getElementById(
        "staymateBookButton"
      );


    if (
      stayMateButton
    ) {

      stayMateButton.addEventListener(
        "click",
        () => {

          startStayMateBooking(
            property,
            stayMatePrice
          );

        }
      );

    }
  }


  // ==========================================================
  // SEND HOTEL TO EXISTING STAYMATE BOOKING FLOW
  // ==========================================================

  function startStayMateBooking(
    property,
    price
  ) {

    const numericPrice =
      Number(
        price
      );


    const hotel = {

      ...property,

      name:
        property.name ||
        hotelName,

      address:
        property.address ||
        address,

      property_token:
        property.property_token ||
        propertyToken,

      rate_per_night: {

        extracted_lowest:
          numericPrice,

        lowest:
          money(
            numericPrice
          )
      }

    };


    const pendingBooking = {

      hotel:

        hotel,

      context: {

        location:
          searchLocation,

        checkIn:
          checkIn,

        checkOut:
          checkOut,

        adults:
          Number(
            adults
          ) || 2,

        children:
          Number(
            children
          ) || 0,

        rooms:
          Number(
            rooms
          ) || 1
      }

    };


    try {

      localStorage.setItem(
        "staymate_pending_booking",
        JSON.stringify(
          pendingBooking
        )
      );

    } catch (
      error
    ) {

      console.error(
        "Unable to save booking data:",
        error
      );

      alert(
        "Unable to continue to booking. Please try again."
      );

      return;
    }


    // Return to the main StayMate page.
    window.location.href =
      "/";
  }


  // ==========================================================
  // START
  // ==========================================================

  loadPrices();

</script>

</body>

</html>
