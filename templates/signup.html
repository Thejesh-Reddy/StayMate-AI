<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | StayMate AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="signupTitle">

            <a href="/" class="auth-brand" aria-label="StayMate AI home">
                <span class="auth-brand-mark">S</span>

                <span class="auth-brand-copy">
                    <span class="auth-brand-name">STAYMATE</span>
                    <span class="auth-brand-ai">AI</span>
                </span>
            </a>

            <header class="auth-header">
                <p class="auth-eyebrow">Welcome to StayMate AI</p>
                <h1 id="signupTitle">Create your account</h1>
                <p>
                    Sign up to discover hotels and manage your bookings easily.
                </p>
            </header>

            <form id="signupForm" class="auth-form" novalidate>

                <div class="auth-form-group">
                    <label for="name">Full name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="auth-form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <p
                    id="signupMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="signupButton"
                    class="auth-submit-button"
                >
                    Continue
                </button>
            </form>

            <div class="auth-divider">
                <span>Already have an account?</span>
            </div>

            <div class="auth-footer">
                <a href="/signin" class="auth-secondary-link">
                    Sign in
                </a>
            </div>

            <p class="auth-legal-text">
                By continuing, you agree to use StayMate AI responsibly.
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='signup.js') }}"></script>
</body>
</html>
