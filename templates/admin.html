<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Dashboard - StayMate AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f9fb;
            color: #18384b;
        }

        .admin-layout {
            min-height: 100vh;
            display: flex;
        }

        /* Sidebar */

        .admin-sidebar {
            width: 250px;
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid #e4edf1;
            padding: 24px 16px;
            display: flex;
            flex-direction: column;
        }

        .admin-logo {
            padding: 0 12px 28px;
        }

        .admin-logo h1 {
            margin: 0;
            color: #159bd3;
            font-size: 22px;
            font-weight: 800;
        }

        .admin-logo p {
            margin: 5px 0 0;
            color: #718895;
            font-size: 12px;
        }

        .admin-nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .admin-nav-button {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 12px;
            background: transparent;
            color: #526e7d;
            padding: 0 14px;
            text-align: left;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .admin-nav-button:hover {
            background: #eef8fc;
            color: #159bd3;
        }

        .admin-nav-button.active {
            background: #159bd3;
            color: #ffffff;
        }

        .admin-sidebar-bottom {
            margin-top: auto;
        }

        .admin-logout {
            width: 100%;
            min-height: 44px;
            border: 1px solid #f0d8d8;
            border-radius: 12px;
            background: #fff7f7;
            color: #c44747;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-logout:hover {
            background: #c44747;
            color: #ffffff;
        }

        /* Main */

        .admin-main {
            flex: 1;
            min-width: 0;
        }

        .admin-header {
            height: 76px;
            background: #ffffff;
            border-bottom: 1px solid #e4edf1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
        }

        .admin-header h2 {
            margin: 0;
            font-size: 21px;
            color: #18384b;
        }

        .admin-user {
            color: #526e7d;
            font-size: 14px;
            font-weight: 600;
        }

        .admin-content {
            padding: 32px;
        }

        .admin-welcome {
            margin-bottom: 26px;
        }

        .admin-welcome h1 {
            margin: 0;
            font-size: 28px;
            color: #18384b;
        }

        .admin-welcome p {
            margin: 7px 0 0;
            color: #718895;
            font-size: 14px;
        }

        /* Stats */

        .stats-grid {
            display: grid;
            grid-template-columns:
                repeat(3, minmax(0, 1fr));
            gap: 20px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid #e4edf1;
            border-radius: 18px;
            padding: 22px;
        }

        .stat-card-label {
            color: #718895;
            font-size: 13px;
            font-weight: 600;
        }

        .stat-card-value {
            margin-top: 9px;
            font-size: 28px;
            font-weight: 800;
            color: #18384b;
        }

        /* Recent bookings */

        .section-card {
            background: #ffffff;
            border: 1px solid #e4edf1;
            border-radius: 18px;
            overflow: hidden;
        }

        .section-card-header {
            padding: 20px 22px;
            border-bottom: 1px solid #e8eff2;
        }

        .section-card-header h3 {
            margin: 0;
            font-size: 17px;
            color: #18384b;
        }

        .empty-state {
            padding: 45px 20px;
            text-align: center;
            color: #718895;
            font-size: 14px;
        }

        @media (max-width: 900px) {

            .admin-sidebar {
                width: 210px;
            }

            .admin-content {
                padding: 24px;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 650px) {

            .admin-layout {
                flex-direction: column;
            }

            .admin-sidebar {
                width: 100%;
                min-height: auto;
                border-right: 0;
                border-bottom: 1px solid #e4edf1;
            }

            .admin-sidebar-bottom {
                margin-top: 20px;
            }

            .admin-header {
                padding: 0 20px;
            }

            .admin-content {
                padding: 20px;
            }

        }

    </style>

</head>

<body>

<div class="admin-layout">

    <aside class="admin-sidebar">

        <div class="admin-logo">

            <h1>STAYMATE AI</h1>

            <p>Administration</p>

        </div>

        <nav class="admin-nav">

            <button
                type="button"
                class="admin-nav-button active"
            >
                Dashboard
            </button>

            <button
                type="button"
                class="admin-nav-button"
            >
                Users
            </button>

            <button
                type="button"
                class="admin-nav-button"
            >
                Bookings
            </button>

            <button
                type="button"
                class="admin-nav-button"
            >
                Revenue
            </button>

        </nav>

        <div class="admin-sidebar-bottom">

            <button
                id="adminLogoutButton"
                type="button"
                class="admin-logout"
            >
                Logout
            </button>

        </div>

    </aside>


    <main class="admin-main">

        <header class="admin-header">

            <h2>Dashboard</h2>

            <div
                id="adminUserName"
                class="admin-user"
            >
                Admin
            </div>

        </header>


        <section class="admin-content">

            <div class="admin-welcome">

                <h1>Dashboard Overview</h1>

                <p>
                    Manage your StayMate AI platform.
                </p>

            </div>


            <div class="stats-grid">

                <div class="stat-card">

                    <div class="stat-card-label">
                        Total Users
                    </div>

                    <div
                        id="totalUsers"
                        class="stat-card-value"
                    >
                        —
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-card-label">
                        Total Bookings
                    </div>

                    <div
                        id="totalBookings"
                        class="stat-card-value"
                    >
                        —
                    </div>

                </div>


                <div class="stat-card">

                    <div class="stat-card-label">
                        Total Revenue
                    </div>

                    <div
                        id="totalRevenue"
                        class="stat-card-value"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="section-card">

                <div class="section-card-header">

                    <h3>
                        Recent Bookings
                    </h3>

                </div>

                <div
                    id="recentBookings"
                    class="empty-state"
                >
                    Loading bookings...
                </div>

            </div>

        </section>

    </main>

</div>


<script>

    async function loadAdminSession() {

        try {

            const response = await fetch(
                "/api/auth/session",
                {
                    credentials: "same-origin"
                }
            );

            const data = await response.json();

            if (
                !data.authenticated ||
                data.user_role !== "admin"
            ) {
                window.location.href = "/";
                return;
            }

            document.getElementById(
                "adminUserName"
            ).textContent =
                data.user_name || "Admin";

        } catch (error) {

            console.error(
                "Admin session error:",
                error
            );

            window.location.href = "/";

        }

    }

    async function loadAdminOverview() {

    try {

        const response = await fetch(
            "/api/admin/overview",
            {
                credentials: "same-origin"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Failed to load dashboard data."
            );
        }

        document.getElementById(
            "totalUsers"
        ).textContent =
            data.total_users;

        document.getElementById(
            "totalBookings"
        ).textContent =
            data.total_bookings;

        document.getElementById(
            "totalRevenue"
        ).textContent =
            "₹" +
            Number(data.total_revenue)
                .toLocaleString("en-IN", {
                    minimumFractionDigits: 2,
                    maximumFractionDigits: 2
                });

    } catch (error) {

        console.error(
            "Admin overview error:",
            error
        );

        document.getElementById(
            "totalUsers"
        ).textContent = "—";

        document.getElementById(
            "totalBookings"
        ).textContent = "—";

        document.getElementById(
            "totalRevenue"
        ).textContent = "—";

    }

}
    async function loadRecentBookings() {

    try {

        const response = await fetch(
            "/api/admin/bookings",
            {
                credentials: "same-origin"
            }
        );

        const data = await response.json();

        if (!response.ok || !data.success) {
            throw new Error(
                data.error || "Failed to load bookings."
            );
        }

        const container =
            document.getElementById("recentBookings");

        if (!data.bookings || data.bookings.length === 0) {

            container.innerHTML =
                "<p>No bookings found.</p>";

            return;
        }

        const recentBookings =
    data.bookings.slice(0, 5);

container.innerHTML =
    recentBookings.map(
        booking => `
            <div class="booking-item">

                <strong>
                    ${booking.hotel_name || "Hotel"}
                </strong>

                <div>
                    Booking:
                    ${booking.booking_reference || "N/A"}
                </div>

                <div>
                    Guest:
                    ${booking.guest_name || "N/A"}
                </div>

                <div>
                    Email:
                    ${booking.email || "N/A"}
                </div>

                <div>
                    Check-in:
                    ${booking.check_in || "N/A"}
                </div>

                <div>
                    Check-out:
                    ${booking.check_out || "N/A"}
                </div>

                <div>
                    Total:
                    ₹${Number(
                        booking.total_amount || 0
                    ).toLocaleString("en-IN", {
                        minimumFractionDigits: 2
                    })}
                </div>

            </div>
        `
    ).join("");

    } catch (error) {

        console.error(
            "Recent bookings error:",
            error
        );

        document.getElementById(
            "recentBookings"
        ).innerHTML =
            "<p>Unable to load recent bookings.</p>";

    }

}


    document
        .getElementById("adminLogoutButton")
        .addEventListener(
            "click",
            async () => {

                try {

                    await fetch(
                        "/api/auth/logout",
                        {
                            method: "POST",
                            credentials: "same-origin"
                        }
                    );

                } finally {

                    window.location.href =
                        "/signin";

                }

            }
        );


    loadAdminSession();
    loadAdminOverview();
    loadRecentBookings();
</script>

</body>

</html>
