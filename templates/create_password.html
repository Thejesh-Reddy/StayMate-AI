<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Password | StayMate AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="createPasswordTitle">

            <a href="/" class="auth-brand" aria-label="StayMate AI home">
                <span class="auth-brand-mark">S</span>

                <span class="auth-brand-copy">
                    <span class="auth-brand-name">STAYMATE</span>
                    <span class="auth-brand-ai">AI</span>
                </span>
            </a>

            <header class="auth-header">
                <p class="auth-eyebrow">Account security</p>

                <h1 id="createPasswordTitle">Create your password</h1>

                <p>
                    Set a secure password to complete your StayMate AI account.
                </p>
            </header>

            <form id="createPasswordForm" class="auth-form" novalidate>

                <div class="auth-form-group">
                    <label for="password">Password</label>

                    <div class="auth-password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="auth-password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <div class="auth-form-group">
                    <label for="confirmPassword">Confirm password</label>

                    <div class="auth-password-wrapper">
                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Re-enter your password"
                            autocomplete="new-password"
                            minlength="8"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="auth-password-toggle"
                            aria-label="Show confirm password"
                            aria-pressed="false"
                        >
                            Show
                        </button>
                    </div>
                </div>

                <p class="auth-helper-text">
                    Use at least 8 characters with a combination of letters,
                    numbers, and symbols.
                </p>

                <p
                    id="createPasswordMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="createPasswordButton"
                    class="auth-submit-button"
                >
                    Create Account
                </button>
            </form>

            <div class="auth-footer">
                <a href="/signin" class="auth-secondary-link">
                    Already have an account? Sign in
                </a>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', filename='create_password.js') }}"></script>
</body>
</html>
