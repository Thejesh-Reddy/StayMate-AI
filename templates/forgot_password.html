<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | StayMate AI</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>

<body class="auth-page">
    <main class="auth-container">
        <section class="auth-card" aria-labelledby="forgotPasswordTitle">

            <a href="/" class="auth-brand" aria-label="StayMate AI home">
                <span class="auth-brand-mark">S</span>

                <span class="auth-brand-copy">
                    <span class="auth-brand-name">STAYMATE</span>
                    <span class="auth-brand-ai">AI</span>
                </span>
            </a>

            <header class="auth-header">
                <p class="auth-eyebrow">Account recovery</p>

                <h1 id="forgotPasswordTitle">Forgot your password?</h1>

                <p>
                    Enter your registered email address and we will send you
                    a password reset link.
                </p>
            </header>

            <form id="forgotPasswordForm" class="auth-form" novalidate>

                <div class="auth-form-group">
                    <label for="email">Email address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <p
                    id="forgotPasswordMessage"
                    class="auth-message"
                    role="alert"
                    aria-live="polite"
                ></p>

                <button
                    type="submit"
                    id="forgotPasswordButton"
                    class="auth-submit-button"
                >
                    Send Reset Link
                </button>
            </form>

            <div class="auth-footer">
                <a href="/signin" class="auth-secondary-link">
                    Back to sign in
                </a>
            </div>

            <p class="auth-legal-text">
                If you do not receive the email, please check your spam folder.
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='forgot_password.js') }}"></script>
</body>
</html>
